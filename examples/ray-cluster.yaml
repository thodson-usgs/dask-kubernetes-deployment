apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cpu-cluster
  namespace: ray
spec:
  rayVersion: "2.9.0"
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: 0.0.0.0
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
          ports:
            - containerPort: 6379  # Redis
            - containerPort: 8265  # Dashboard
            - containerPort: 10001 # Client
        nodeSelector:
          eks.amazonaws.com/nodegroup: c7i-2xlarge
  workerGroupSpecs:
  - groupName: worker-group
    replicas: 2
    minReplicas: 0
    maxReplicas: 5
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
        nodeSelector:
          eks.amazonaws.com/nodegroup: c7i-2xlarge
